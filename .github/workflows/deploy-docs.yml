name: Deploy Documentation Portal

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  repository_dispatch:
    types: [docs-updated, submodule-sync]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUBMODULES_PAT: ${{ secrets.SUBMODULES_PAT }}
      TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT || github.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync and validate documentation submodules
        run: npm run sync-docs -- --strict

      - name: Generate Living Binder commit ledger
        run: npm run binder:index

      - name: Check TypeScript types
        run: npm run types:check

      - name: Run automated tests
        run: npm test

      - name: Build static Next.js Documentation Portal
        run: npm run build

      - name: Check Living Binder reprint drift
        if: github.event_name != 'pull_request'
        run: node scripts/check-binder-drift.mjs --notify-tracker

      - name: Deploy Production to Cloudflare Pages (main)
        if: (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=sunshade-docs --branch=main

      - name: Deploy Staging to Cloudflare Pages (staging)
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=sunshade-docs --branch=staging

      - name: Deploy PR Preview to Cloudflare Pages
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=sunshade-docs --branch=pr-${{ github.event.pull_request.number }}
